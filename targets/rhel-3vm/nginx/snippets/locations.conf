# --- API -> backend, unless the readiness check took the backend out of rotation
# ($shop_backend_ready is set in /etc/nginx/shop-backend-state.conf by shop-upstream-check).
location /api/ {
    # Only applies to responses nginx generates itself (the 503 below); proxied responses keep their own type.
    default_type application/json;
    if ($shop_backend_ready = 0) {
        add_header Retry-After 30 always;
        return 503 '{"success":false,"errorCode":"SERVICE_UNAVAILABLE","message":"Hệ thống đang bảo trì, vui lòng thử lại sau ít phút","details":[]}';
    }
    include /etc/nginx/snippets/shop/proxy.conf;
}

# Management endpoints are never exposed through the public entry point.
location /actuator {
    return 404;
}

# --- Front end (static React build)
# Hashed assets never change: cache for a year.
location /assets/ {
    include /etc/nginx/snippets/shop/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# Product illustrations.
location /images/ {
    include /etc/nginx/snippets/shop/security-headers.conf;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
}

# The HTML entry point must always be revalidated so new releases are picked up.
location = /index.html {
    include /etc/nginx/snippets/shop/security-headers.conf;
    add_header Cache-Control "no-cache";
}

# Single page application: unknown paths fall back to index.html.
location / {
    try_files $uri $uri/ /index.html;
}
