add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Content-Security-Policy is intentionally not enforced by default (it would block third-party scripts
# injected by monitoring/support tooling). Enable and tune when the deployment's script sources are known:
# add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" always;
